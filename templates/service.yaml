
{{- range $key, $svc := (.Values.services | default dict) }}

---
apiVersion: v1
kind: Service
metadata:
    name: {{ include "templating-deep-dive.servicename" $ }}-{{ $key }}
    labels: {{ include  "templating-deep-dive.selectorLabels" $ | nindent 6 }}
spec:
    type: {{ .type }}
    selector: {{ include  "templating-deep-dive.selectorLabels" $ | nindent 6 }}
    ports:
        - protocol: TCP
          port: {{ include "templating-deep-dive.validators.portRange" .port }}
          targetPort: {{ $.Values.containerPort.http }}
          ## value of . is {{ . }}
{{- end }}



