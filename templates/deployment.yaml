apiVersion: apps/v1
kind: Deployment
metadata:
    name: {{ include "templating-deep-dive.fullname" . }}
    labels: {{ include "templating-deep-dive.selectorLabels" . | nindent 6}}
spec:
    replicas: {{ .Values.replicaCount }}
    selector:
        matchLabels: {{ include "templating-deep-dive.selectorLabels" . | nindent 10}}
    template:
        metadata:
            labels: {{ include "templating-deep-dive.selectorLabels" . | nindent 14}}
        spec:
            containers:
                - name: nginx
                  image: "{{ .Values.image.name }}:{{ .Values.image.tag }}"
                  {{-  with .Values.SecurityContext | default dict}}
                  {{- if and (hasKey . "enabled") .enabled }}
                  securityContext:
                    runAsUser: {{ .runAsUser }}
                    fsGroup: {{ .fsGroup }}
                  {{- end}}
                  {{- end}}
                  {{- if .Values.services | default dict | len }}
                  ports:
                    - containerPort: {{ .Values.containerPort.http }}
                  {{- end }}
#{{ .Values.replicaCount }}
#{{- if eq .Values.environment "production" }} 5 {{- else }} 2 {{- end }}

